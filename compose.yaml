services:
  expo-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cbsdemo-expo-server
    environment:
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-development-secret}
      EXPO_HOST: ${EXPO_HOST:-lan}
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:${EXPO_PORT:-8081}}
      EXPO_PORT: 8081
    ports:
      - "${EXPO_PORT:-8081}:8081"
    restart: unless-stopped

  sonarqube-db:
    image: postgres:17-alpine
    container_name: cbsdemo-sonarqube-db
    environment:
      POSTGRES_USER: ${SONARQUBE_DB_USER:-sonar}
      POSTGRES_PASSWORD: ${SONARQUBE_DB_PASSWORD:-sonar}
      POSTGRES_DB: ${SONARQUBE_DB_NAME:-sonarqube}
    volumes:
      - sonarqube-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  sonarqube:
    image: sonarqube:community
    container_name: cbsdemo-sonarqube
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${SONARQUBE_DB_NAME:-sonarqube}
      SONAR_JDBC_USERNAME: ${SONARQUBE_DB_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${SONARQUBE_DB_PASSWORD:-sonar}
    ports:
      - "${SONARQUBE_PORT:-8888}:9000"
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://localhost:9000/api/system/status | grep -q '"status":"UP"'
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    restart: unless-stopped

  sonarqube-mcp:
    image: sonarsource/sonarqube-mcp:${SONARQUBE_MCP_VERSION:-1.18.1.2664}
    container_name: cbsdemo-sonarqube-mcp
    depends_on:
      sonarqube:
        condition: service_healthy
    environment:
      SONARQUBE_URL: http://sonarqube:9000
      SONARQUBE_TOKEN: ${SONARQUBE_MCP_TOKEN:-}
      SONARQUBE_TRANSPORT: http
      SONARQUBE_HTTP_HOST: 0.0.0.0
      SONARQUBE_MCP_IN_CONTAINER: "true"
    ports:
      - "127.0.0.1:${SONARQUBE_MCP_PORT:-8765}:8080"
    restart: unless-stopped

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:latest
    profiles:
      - analysis
    depends_on:
      sonarqube:
        condition: service_healthy
    working_dir: /usr/src
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    volumes:
      - .:/usr/src:ro
    command:
      - -Dsonar.host.url=http://sonarqube:9000
      - -Dsonar.projectBaseDir=/usr/src

volumes:
  sonarqube-db-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
