sonar.projectKey=cbsdemo
sonar.projectName=CBSDemo
sonar.sourceEncoding=UTF-8

sonar.sources=app,src
sonar.tests=app,src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/node_modules/**,**/.expo/**,**/dist/**,**/android/**,**/ios/**,**/coverage/**,**/*.d.ts
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/app/**,**/src/i18n/resources.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.eslint.reportPaths=reports/eslint.json
